name: Release

# Auto-publishes a GitHub Release (a versioned snapshot inside THIS repo, with
# the card JS attached) whenever the card changes on main. This is what lets
# HACS show a one-click "Update" — it does NOT submit anything to HACS or any
# public list. Runs on GitHub's runner, so it can create the tag/release.
on:
  push:
    branches: [main]
    paths:
      - "glanceweathercard.js"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute version tag
        id: ver
        run: echo "tag=v$(date -u +'%Y.%m.%d.%H%M%S')" >> "$GITHUB_OUTPUT"
      - name: Stamp version into the card
        run: |
          sed -i "s/const CARD_VERSION = \"[^\"]*\";/const CARD_VERSION = \"${{ steps.ver.outputs.tag }}\";/" glanceweathercard.js
          grep -n "CARD_VERSION =" glanceweathercard.js
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: glanceweathercard.js
