name: Release

# Publishes a GitHub Release (with the card JS attached) whenever a version
# tag like v1.0.0 is pushed. HACS uses these releases to offer updates.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: glanceweathercard.js
